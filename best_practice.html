  <script>
function backToHome(event) {
  event.preventDefault();

  // หากเปิดจากแท็บเดิม ให้ปิดแท็บย่อยเมื่อย้อนกลับ
  if (window.opener && !window.opener.closed) {
    window.close();
    return false;
  }

  // เปิดในแท็บเดียวกัน
  if (window.history.length > 1) {
    window.history.back();
    return false;
  }

  // กลับหน้าแรกโดยตรง
  window.location.href = 'index.html';
  return false;
}
</script>

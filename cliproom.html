<!doctype html>
<html lang="th">
<head>
  <script src="app-config.js?v=20260901-central-api-1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="description" content="ระบบ Cliproom อบรมออนไลน์ผ่านวิดีโอ แบบทดสอบ และเกียรติบัตร">
  <title>Cliproom — ระบบอบรมออนไลน์</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#eef5fb;font-family:Arial,sans-serif;overflow:hidden}
    .loading{position:fixed;inset:0;display:grid;place-items:center;color:#123b69;font-weight:700;z-index:0;text-align:center;padding:24px}
    .spinner{width:52px;height:52px;margin:0 auto 13px;border:6px solid #cfe3f3;border-top-color:#0b73ce;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    iframe{position:relative;z-index:1;display:block;width:100%;height:100%;border:0;background:#fff}
    iframe[hidden]{display:none}
    .error{color:#b42318}
  </style>
  <link rel="stylesheet" href="theme-modern.css?v=20260902-1">
</head>
<body class="theme-v2">
  <div class="loading" id="cliproomStatus"><div><div class="spinner" id="cliproomSpinner"></div><div id="cliproomStatusText">กำลังเปิดระบบ Cliproom...</div></div></div>
  <iframe id="cliproomFrame" hidden title="ระบบ Cliproom" allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
  (() => {
    'use strict';
    const MAIN_API_URL = String((window.APP_CONFIG && window.APP_CONFIG.API_URL) || '').trim();
    const status = document.getElementById('cliproomStatus');
    const statusText = document.getElementById('cliproomStatusText');
    const spinner = document.getElementById('cliproomSpinner');
    const frame = document.getElementById('cliproomFrame');
    const CACHE_KEY = 'SITE_FAST:cliproom-page-exec-v3';
    const CACHE_AGE = 10 * 60 * 1000;
    const RETRY_DELAYS = [1000, 1800, 3200, 6000, 10000, 16000, 30000];
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function readCache() {
      for (const storage of [window.sessionStorage, window.localStorage]) {
        try {
          const saved = JSON.parse(storage.getItem(CACHE_KEY) || 'null');
          const url = String(saved?.url || '').trim();
          if (saved?.savedAt && Date.now() - saved.savedAt <= CACHE_AGE && /^https:\/\/script\.google\.com\/macros\/s\/[^/?#]+\/exec(?:[?#].*)?$/i.test(url)) return url;
        } catch (_) {}
      }
      return '';
    }

    function writeCache(url) {
      const raw = JSON.stringify({ savedAt: Date.now(), url });
      try { sessionStorage.setItem(CACHE_KEY, raw); } catch (_) {}
      try { localStorage.setItem(CACHE_KEY, raw); } catch (_) {}
    }

    function jsonpOnce() {
      const mainApi = String(MAIN_API_URL || '').trim();
      if (!mainApi) return Promise.reject(new Error('ไม่พบ URL ของ Apps Script หลัก'));
      return new Promise((resolve, reject) => {
        const callbackName = '__cliproomPageResolver_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        let timer = null;
        let settled = false;
        const cleanup = () => {
          if (timer) clearTimeout(timer);
          try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        };
        const finish = (ok, value) => {
          if (settled) return;
          settled = true;
          cleanup();
          ok ? resolve(value) : reject(value);
        };
        window[callbackName] = result => finish(true, result);
        const url = new URL(mainApi);
        url.searchParams.set('mode', 'cliproomexec');
        url.searchParams.set('callback', callbackName);
        url.searchParams.set('_t', String(Date.now()));
        script.src = url.toString();
        script.async = true;
        script.onerror = () => finish(false, new Error('เชื่อมต่อ Apps Script หลักไม่สำเร็จ'));
        timer = setTimeout(() => finish(false, new Error('Apps Script หลักใช้เวลาตอบกลับนานเกินไป')), 45000);
        document.head.appendChild(script);
      });
    }

    async function resolveCliproomExecUrl() {
      const cached = readCache();
      if (cached) return cached;
      let attempt = 0;
      while (true) {
        try {
          const result = await jsonpOnce();
          if (!result || result.success === false) throw new Error((result && result.message) || 'อ่าน URL Cliproom จากชีตไม่สำเร็จ');
          const execUrl = String(result.url || '').trim();
          if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/?#]+\/exec(?:[?#].*)?$/i.test(execUrl)) throw new Error('URL Cliproom จากชีตไม่ถูกต้อง');
          writeCache(execUrl);
          return execUrl;
        } catch (error) {
          attempt += 1;
          const delay = RETRY_DELAYS[Math.min(attempt - 1, RETRY_DELAYS.length - 1)];
          const message = `กำลังเชื่อมต่อ Cliproom... ระบบจะลองใหม่อัตโนมัติ ครั้งที่ ${attempt}`;
          if (statusText) statusText.textContent = message;
          else if (status) status.textContent = message;
          if (navigator.onLine === false) {
            await Promise.race([
              new Promise(resolve => window.addEventListener('online', resolve, { once: true })),
              sleep(Math.max(delay, 15000))
            ]);
          } else {
            await sleep(delay);
          }
        }
      }
    }

    resolveCliproomExecUrl().then(execUrl => {
      const target = new URL(execUrl);
      
      frame.src = target.toString();
      frame.hidden = false;
      if (status) status.style.display = 'none';
    }).catch(error => {
      if (spinner) spinner.style.display = 'none';
      if (status) status.classList.add('error');
      const text = 'เปิดระบบ Cliproom ไม่สำเร็จ: ' + (error?.message || error);
      if (statusText) statusText.textContent = text;
      else if (status) status.textContent = text;
    });
  })();
  </script>
</body>
</html>

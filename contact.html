<!DOCTYPE html>
<html lang="th">
<head>
    <script src="app-config.js?v=20260901-central-api-1"></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ติดต่อและสอบถาม">
  <title>ติดต่อ/สอบถาม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="about-page.css?v=20260824-1">
  <link rel="stylesheet" href="admin-subpage.css?v=20260826-1">
  <link rel="stylesheet" href="contact-manager.css?v=20260902-1">
  <link rel="stylesheet" href="theme-modern.css?v=20260902-1">
</head>
<body class="theme-v2" data-about-page="contact">
  <main class="about-page">
    <div class="about-container">
      <div class="about-topbar admin-subpage-topbar">
        <button class="admin-manage-data-button" type="button" data-admin-page="contact" hidden>จัดการข้อมูล</button>
        <a class="about-back" href="index.html">← กลับหน้าหลัก</a>
      </div>
      <header class="about-heading">
        <div class="about-kicker">CONTACT</div>
        <h1>ติดต่อ/สอบถาม</h1>
        <div class="about-heading-line"></div>
      </header>
      <div id="aboutPageContent">
        <div id="contactPanel" class="contact-panel">
          <div class="contact-details">
            <div class="contact-row contact-organization" data-optional><span id="contactOrganization"></span></div>
            <div class="contact-row" data-optional><span id="contactAddress"></span></div>
            <div class="contact-row" data-optional>โทรศัพท์ <span id="contactPhone"></span></div>
          </div>
          <div id="contactSocials" class="contact-socials" aria-label="ช่องทางสื่อสังคมออนไลน์">
            <a id="contactFacebook" class="contact-social contact-facebook" target="_blank" rel="noopener noreferrer" aria-label="Facebook" hidden><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a>
            <a id="contactLine" class="contact-social contact-line" target="_blank" rel="noopener noreferrer" aria-label="Line" hidden><i class="fa-brands fa-line" aria-hidden="true"></i></a>
          </div>
          <div id="contactMapWrap" class="contact-map-wrap" hidden>
            <iframe id="contactMap" class="contact-map" title="แผนที่ตั้งหน่วยงาน" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <a id="contactMapLink" class="contact-map-link" target="_blank" rel="noopener noreferrer">เปิดใน Google Map</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="about-page.js?v=20260902-2"></script>
  <script src="admin-subpage.js?v=20260826-1"></script>
  <script src="contact-manager.js?v=20260902-1"></script>
</body>
</html>

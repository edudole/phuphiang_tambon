<!DOCTYPE html>
<html lang="th">
<head>
    <script src="app-config.js?v=20260901-central-api-1"></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>จัดการแหล่งเรียนรู้</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#eef2f7;font-family:Arial,sans-serif;overflow:hidden}
    .admin-frame{display:block;width:100%;height:100%;border:0;background:#fff}
    .frame-loading{position:fixed;z-index:2;inset:0;display:grid;place-items:center;background:#eef2f7;color:#334155;text-align:center;transition:opacity .2s ease,visibility .2s ease}
    .frame-loading.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    .spinner{width:44px;height:44px;margin:0 auto 14px;border:4px solid #cbd5e1;border-top-color:#dc2626;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <link rel="stylesheet" href="theme-modern.css?v=20260902-1">
</head>
<body class="theme-v2">
  <div id="frameLoading" class="frame-loading">
    <div><div class="spinner"></div><strong>กำลังเปิดระบบจัดการแหล่งเรียนรู้...</strong></div>
  </div>
  <iframe
    id="learningAdminFrame"
    class="admin-frame"
    src="about:blank"
    title="จัดการแหล่งเรียนรู้"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const learningAdminFrame = document.getElementById('learningAdminFrame');
    learningAdminFrame.addEventListener('load',function(){
      if (learningAdminFrame.src === 'about:blank') return;
      document.getElementById('frameLoading').classList.add('is-hidden');
    });
    learningAdminFrame.src = window.APP_CONFIG.API_URL + '?page=admin';
  </script>
</body>
</html>
